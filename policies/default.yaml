# Aegis policy (J2). Le LLM propose, ce fichier dispose.
# Posture "summarizer" = lecture seule : il ne doit JAMAIS modifier le disque.
agents:
  summarizer:
    allowed_tools:
      - list_allowed_directories
      - list_directory
      - list_directory_with_sizes
      - directory_tree
      - read_file
      - read_text_file
      - read_multiple_files
      - search_files
      - get_file_info
    denied_tools:
      - write_file
      - edit_file
      - move_file
      - create_directory
    max_calls_per_session: 10
    deny_path_tags:
      - confidential
